[project]
name = "deriv-mt5"
version = "0.1.0"
description = "Shared exact-cent rules for the Deriv binary options profile"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deriv_mt5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
