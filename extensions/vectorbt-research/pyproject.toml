[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "vectorbt-research"
version = "0.1.0"
description = "Local vectorbt research environment for Deriv binary backtests"
requires-python = ">=3.13,<3.14"
dependencies = [
    "deriv-mt5",
    "pyarrow>=26.0.0",
    "vectorbt==1.2.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = true

[tool.uv.sources]
deriv-mt5 = { path = "../deriv-mt5" }
